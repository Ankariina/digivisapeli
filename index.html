<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitaidot-Visapeli</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .heading-font {
            font-family: 'Fredoka', sans-serif;
        }
        .card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }
        .option-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
        }
        .pulse-subtle {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: fall 3s ease-in-out infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen text-gray-800">

    <div id="game-container" class="w-full max-w-2xl bg-white rounded-3xl card-shadow overflow-hidden relative">
        
        <!-- HEADER / PROGRESS BAR -->
        <div class="bg-indigo-600 text-white p-6 pb-8 relative">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3">
                    <span class="bg-indigo-500 p-2.5 rounded-2xl text-yellow-300">
                        <i class="fa-solid fa-laptop-code text-2xl"></i>
                    </span>
                    <div>
                        <h1 class="heading-font text-2xl font-bold tracking-wide">DigiMestari</h1>
                        <p class="text-xs text-indigo-200">Testaa digitaitosi!</p>
                    </div>
                </div>
                <div class="bg-indigo-700/60 backdrop-blur-md px-4 py-2 rounded-2xl border border-indigo-400/30">
                    <span class="text-xs text-indigo-200 block">Pisteet</span>
                    <span id="score" class="heading-font text-2xl font-bold text-yellow-300">0</span>
                </div>
            </div>

            <!-- Edistymispalkki -->
            <div class="space-y-1">
                <div class="flex justify-between text-xs font-semibold text-indigo-200">
                    <span id="question-number">Kysymys 1 / 10</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-indigo-900/40 rounded-full h-3 overflow-hidden p-0.5">
                    <div id="progress-bar" class="bg-gradient-to-r from-yellow-400 to-amber-300 h-full rounded-full transition-all duration-500" style="width: 10%;"></div>
                </div>
            </div>
        </div>

        <!-- MAIN GAME VIEW -->
        <div id="quiz-screen" class="p-6 md:p-8 space-y-6">
            
            <!-- Kysymysteksti -->
            <div class="bg-indigo-50/80 rounded-2xl p-5 border border-indigo-100 min-h-[100px] flex items-center">
                <h2 id="question-text" class="text-xl md:text-2xl font-bold text-indigo-950 leading-snug">
                    Ladataan kysymystä...
                </h2>
            </div>

            <!-- Vihje Osio -->
            <div id="hint-box" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 text-amber-900 text-sm flex items-start space-x-3 animate-fade-in">
                <i class="fa-solid fa-lightbulb text-amber-500 text-xl mt-0.5 shrink-0"></i>
                <div>
                    <strong class="font-bold block">Vihje:</strong>
                    <span id="hint-text"></span>
                </div>
            </div>

            <!-- Vaihtoehdot -->
            <div id="options-container" class="grid grid-cols-1 gap-3.5">
                <!-- Painikkeet luodaan JavaScriptillä -->
            </div>

            <!-- Alapalkin toimintopainikkeet -->
            <div class="pt-2 flex justify-between items-center border-t border-gray-100">
                <button id="hint-btn" onclick="toggleHint()" class="flex items-center space-x-2 text-indigo-600 hover:text-indigo-800 font-bold text-sm py-2 px-4 rounded-xl hover:bg-indigo-50 transition">
                    <i class="fa-regular fa-lightbulb text-lg text-amber-500"></i>
                    <span>Näytä vihje</span>
                </button>

                <button id="next-btn" onclick="nextQuestion()" disabled class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-2xl shadow-lg hover:shadow-xl transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2">
                    <span>Seuraava</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- RESULT SCREEN (Piilotettu aluksi) -->
        <div id="result-screen" class="hidden p-8 text-center space-y-6 my-4">
            <div class="inline-block p-6 rounded-full bg-yellow-100 text-yellow-600 mb-2">
                <i id="result-icon" class="fa-solid fa-trophy text-6xl"></i>
            </div>
            
            <h2 id="result-title" class="heading-font text-3xl md:text-4xl font-bold text-gray-800">
                Onnittelut!
            </h2>
            
            <p id="result-message" class="text-gray-600 text-lg max-w-md mx-auto">
                Olet todellinen digimestari! Osaat navigoida verkossa turvallisesti ja taitavasti.
            </p>

            <div class="bg-indigo-50 rounded-2xl p-6 max-w-xs mx-auto border border-indigo-100">
                <span class="text-sm text-gray-500 uppercase font-semibold tracking-wider block">Lopulliset Pisteet</span>
                <span id="final-score" class="heading-font text-5xl font-black text-indigo-600 my-2 block">10 / 10</span>
                <span id="percentage" class="text-sm font-bold text-indigo-400">100% oikein</span>
            </div>

            <div class="pt-4">
                <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-2xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Pelaa uudelleen
                </button>
            </div>
        </div>

    </div>

    <script>
        // Kysymykset ja vaihtoehdot
        const questions = [
            {
                id: 1,
                question: "Mitä ohjelmaa käytät, kun haluat mennä verkkosivulle, kuten iltalehti.fi tai yle.fi?",
                options: [
                    "Hakukone",
                    "Selain",
                    "Sähköposti",
                    "Käyttöjärjestelmä"
                ],
                correct: 1, // B
                hint: "Tällaisia ohjelmia ovat esimerkiksi Chrome, Edge, Safari ja Firefox."
            },
            {
                id: 2,
                question: "Sait sähköpostiisi yllättävän viestin, jossa luvataan suuri rahapalkinto. Sinun tarvitsee vain klikata outoa linkkiä. Mikä tämä viesti todennäköisesti on?",
                options: [
                    "Tärkeä ilmoitus pankilta",
                    "Ystävän lähettämä vitsi",
                    "Roskaposti tai huijausyritys",
                    "Verkkokaupan mainos"
                ],
                correct: 2, // C
                hint: "Jos jokin kuulostaa liian hyvältä ollakseen totta, se on usein huijaus. Älä klikkaa tuntemattomia linkkejä!"
            },
            {
                id: 3,
                question: "Haluat tallentaa valokuvasi niin, että pääset niihin käsiksi sekä puhelimellasi että tietokoneellasi. Mikä on tähän paras paikka?",
                options: [
                    "USB-muistitikku",
                    "Puhelimen muisti",
                    "Tietokoneen kovalevy",
                    "Pilvipalvelu (esim. Google Drive)"
                ],
                correct: 3, // D
                hint: "Tämä palvelu tallentaa tiedostot internetiin, josta ne ovat käytettävissä millä tahansa laitteella."
            },
            {
                id: 4,
                question: "Mikä seuraavista on perusohjelmisto, joka saa esimerkiksi iPhonen tai Samsungin puhelimen ylipäätään toimimaan?",
                options: [
                    "Pilvipalvelu",
                    "Käyttöjärjestelmä",
                    "Selain",
                    "Sovellus"
                ],
                correct: 1, // B
                hint: "Esimerkkejä tästä ovat Android, iOS ja Windows."
            },
            {
                id: 5,
                question: "Haluat katsoa elokuvan tai sarjan suoraan televisiostasi internetin kautta. Minkä tyyppistä palvelua etsit?",
                options: [
                    "Hakukone",
                    "Suoratoistopalvelu",
                    "Verkkokauppa",
                    "Sosiaalinen media"
                ],
                correct: 1, // B
                hint: "Esimerkkejä ovat Yle Areena, Netflix ja Ruutu."
            },
            {
                id: 6,
                question: "Kun tallennat verkkopankista laskun omalle tietokoneellesi, mitä toimenpidettä kutsutaan tällä nimellä?",
                options: [
                    "Lataaminen",
                    "Selaaminen",
                    "Jakaminen",
                    "Suoratoisto"
                ],
                correct: 0, // A
                hint: "Englanniksi tämä toimenpide on 'download'."
            },
            {
                id: 7,
                question: "Mikä seuraavista palveluista on tarkoitettu ensisijaisesti ystävien kanssa yhteydenpitoon ja kuulumisten jakamiseen?",
                options: [
                    "Sähköposti",
                    "Sosiaalinen media",
                    "Pilvipalvelu",
                    "Verkkokauppa"
                ],
                correct: 1, // B
                hint: "Tähän ryhmään kuuluvat esimerkiksi Facebook, Instagram ja WhatsApp."
            },
            {
                id: 8,
                question: "Olet kahvilassa ja haluat yhdistää kannettavan tietokoneesi internetiin ilman johtoja. Mitä todennäköisesti käytät?",
                options: [
                    "Bluetooth",
                    "USB-tikku",
                    "Oheislaite",
                    "Wi-Fi (Langaton verkko)"
                ],
                correct: 3, // D
                hint: "Tämä langaton paikallisverkko löytyy nykyään lähes jokaisesta julkisesta tilasta."
            },
            {
                id: 9,
                question: "Luet uutisartikkelia, ja tekstin seassa on sinisellä korostettu ja alleviivattu sana, jota klikkaamalla pääset toiselle sivulle. Mikä tämä on?",
                options: [
                    "Tiedostomuoto",
                    "Linkki",
                    "Kirjanmerkki",
                    "Eväste"
                ],
                correct: 1, // B
                hint: "Sitä kutsutaan myös nimellä 'hyperlinkki'."
            },
            {
                id: 10,
                question: "Haluat tarkistaa sääennusteen tablet-laitteellasi. Minkä todennäköisesti avaat laitteen aloitusnäytöltä?",
                options: [
                    "Asetukset",
                    "Tietoturvaohjelmisto",
                    "Sääsovellus",
                    "Selain"
                ],
                correct: 2, // C
                hint: "Nämä ovat mobiililaitteille ladattavia pienen kokoluokan ohjelmia (eli 'appeja')."
            }
        ];

        // Pelin tila
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;
        let answered = false;

        // UI Elementit
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionNumber = document.getElementById('question-number');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const scoreDisplay = document.getElementById('score');
        const nextBtn = document.getElementById('next-btn');
        const hintBtn = document.getElementById('hint-btn');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        // Ääniefektit Syntetisaattorilla (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        // Aloitetaan peli
        function loadQuestion() {
            answered = false;
            selectedOption = null;

            const q = questions[currentQuestionIndex];
            
            // Paivita otsikko ja vihje
            questionText.textContent = q.question;
            hintText.textContent = q.hint;
            hintBox.classList.add('hidden');

            // Paivita edistyminen
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressPercent.textContent = `${Math.round(progress)}%`;
            questionNumber.textContent = `Kysymys ${currentQuestionIndex + 1} / ${questions.length}`;

            // Tyhjennä edelliset vaihtoehdot
            optionsContainer.innerHTML = '';

            const letterPrefixes = ['A', 'B', 'C', 'D'];

            // Luodaan valinnat
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-2xl border-2 border-gray-200 hover:border-indigo-300 bg-white text-gray-700 font-semibold flex items-center justify-between group`;
                btn.onclick = () => selectOption(index);

                btn.innerHTML = `
                    <div class="flex items-center space-x-3.5">
                        <span class="w-8 h-8 rounded-xl bg-gray-100 group-hover:bg-indigo-100 text-gray-500 group-hover:text-indigo-600 flex items-center justify-center font-bold text-sm transition">
                            ${letterPrefixes[index]}
                        </span>
                        <span class="text-base">${opt}</span>
                    </div>
                    <i class="status-icon fa-regular fa-circle text-gray-300 text-xl"></i>
                `;

                optionsContainer.appendChild(btn);
            });

            // Piilota/Palauta napit
            nextBtn.classList.add('hidden');
            hintBtn.classList.remove('hidden');
        }

        // Vaihtoehdon valinta
        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('button');

            if (index === q.correct) {
                // Oikein
                playSound('correct');
                score++;
                scoreDisplay.textContent = score;

                buttons[index].className = 'option-btn w-full text-left p-4 rounded-2xl border-2 border-green-500 bg-green-50 text-green-900 font-semibold flex items-center justify-between';
                buttons[index].querySelector('.status-icon').className = 'status-icon fa-solid fa-circle-check text-green-600 text-xl';
            } else {
                // Väärin
                playSound('wrong');
                buttons[index].className = 'option-btn w-full text-left p-4 rounded-2xl border-2 border-red-400 bg-red-50 text-red-900 font-semibold flex items-center justify-between';
                buttons[index].querySelector('.status-icon').className = 'status-icon fa-solid fa-circle-xmark text-red-500 text-xl';

                // Näytä oikea vastaus
                buttons[q.correct].className = 'option-btn w-full text-left p-4 rounded-2xl border-2 border-green-500 bg-green-50 text-green-900 font-semibold flex items-center justify-between';
                buttons[q.correct].querySelector('.status-icon').className = 'status-icon fa-solid fa-circle-check text-green-600 text-xl';
            }

            // Lukitse kaikki muut painikkeet
            buttons.forEach(btn => btn.disabled = true);

            // Näytä seuraava-painike
            nextBtn.classList.remove('hidden');
            nextBtn.disabled = false;
        }

        // Näytä vihje
        function toggleHint() {
            playSound('click');
            hintBox.classList.toggle('hidden');
        }

        // Seuraava kysymys
        function nextQuestion() {
            playSound('click');
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Tulosruudun näyttäminen
        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            const percentageVal = Math.round((score / questions.length) * 100);
            document.getElementById('percentage').textContent = `${percentageVal}% oikein`;

            const resultTitle = document.getElementById('result-title');
            const resultMsg = document.getElementById('result-message');
            const resultIcon = document.getElementById('result-icon');

            if (score === 10) {
                resultTitle.textContent = "Täydelliset pisteet!";
                resultMsg.textContent = "Upeaa työtä! Olet aito digivelho ja verkon mestari.";
                resultIcon.className = "fa-solid fa-crown text-6xl text-amber-500";
            } else if (score >= 7) {
                resultTitle.textContent = "Hienoa työtä!";
                resultMsg.textContent = "Sinulla on erittäin hyvät digitaidot hallussa!";
                resultIcon.className = "fa-solid fa-trophy text-6xl text-yellow-500";
            } else if (score >= 5) {
                resultTitle.textContent = "Hyvä yritys!";
                resultMsg.textContent = "Perusteet ovat hallussa, mutta pieni kertaaminen ei tee pahaa.";
                resultIcon.className = "fa-solid fa-thumbs-up text-6xl text-indigo-500";
            } else {
                resultTitle.textContent = "Harjoitus tekee mestarin!";
                resultMsg.textContent = "Digitaitojen oppiminen vie aikaa. Kokeile peliä uudestaan!";
                resultIcon.className = "fa-solid fa-seedling text-6xl text-green-500";
            }
        }

        // Pelin uudelleenaloitus
        function restartQuiz() {
            playSound('click');
            currentQuestionIndex = 0;
            score = 0;
            scoreDisplay.textContent = '0';
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        // Käynnistä peli
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
